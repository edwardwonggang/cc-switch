name: Release (Windows x64, unsigned)

# ---------------------------------------------------------------------------
# Windows-only, secret-free release build.
#
# WHY THIS REPLACES THE UPSTREAM RELEASE WORKFLOW IN THIS FORK
#   The upstream pipeline builds macOS (Apple certificate + notarization),
#   Linux, and Windows x64/ARM64, and it minisigns the Tauri updater bundles.
#   Every one of those jobs needs repository secrets a fork does not have
#   (TAURI_SIGNING_PRIVATE_KEY, APPLE_CERTIFICATE, APPLE_ID, ...). Because
#   "Prepare Tauri signing key" runs before anything is compiled and does
#   `exit 1` on a missing secret, tagging the fork made all five matrix jobs
#   fail instantly and produced no artifact at all.
#
# WHAT THIS WORKFLOW DOES INSTEAD
#   * Builds x86_64 Windows only, on windows-2022, in a single job.
#   * Manual runs default to the portable ZIP only. Installer opt-in and
#     push/tag/release runs retain MSI + NSIS + portable outputs.
#   * Needs no signing secret: `--config src-tauri/tauri.unsigned.conf.json`
#     overlays bundle.createUpdaterArtifacts=false, so tauri-cli never tries to
#     minisign the updater bundle. NOTE: setting TAURI_SIGNING_PRIVATE_KEY to an
#     empty string does NOT skip signing -- tauri-cli only checks whether the
#     variable exists and then fails while decoding it.
#   * Requests `contents: write` explicitly, because this repository keeps the
#     default GITHUB_TOKEN permission at "read".
#
# WHY THE OVERLAY ALSO CLEARS THE UPDATER ENDPOINTS
#   This fork exists to carry patches that upstream does not have (currently the
#   per-provider outbound proxy switch). tauri.conf.json ships the upstream
#   updater endpoints (dl.ccswitch.io, and upstream's own GitHub Releases), and
#   the fork inherits upstream's updater pubkey -- so an installed self-built
#   binary happily offers the official release, and accepting it REPLACES the
#   binary and silently discards the patches. The overlay therefore sets
#   plugins.updater.endpoints = [].
#
#   This is the safe way to switch the updater off:
#     - Config merge is json_patch/JSON Merge Patch semantics (RFC 7386), so an
#       array in the overlay REPLACES the base array instead of appending to it.
#     - The plugin still registers, because `pubkey` keeps its value and
#       tauri-plugin-updater validates nothing about endpoints at setup time.
#       (Removing `pubkey` instead would make plugin setup fail, and any later
#       `app.updater_builder()` panics on the missing plugin state.)
#     - `Updater::build()` then returns Error::EmptyEndpoints at check time, so
#       nothing panics: the launch-time auto check only logs to the webview
#       console, and a manual "Check for Updates" click shows a clear failure
#       toast rather than inventing an "up to date" answer.
#   To re-enable upstream updates, delete the plugins.updater block from the
#   overlay -- nothing else in this workflow depends on it.
#
# HOW TO RUN
#   1. Actions -> "Release (Windows x64, unsigned)" -> Run workflow
#      Builds and attaches the files to the run (no GitHub Release).
#   2. Fill in "release_tag" in the run form, or push a v* tag
#      Additionally publishes a GitHub Release with the same files.
#
# RESTORING THE UPSTREAM MULTI-PLATFORM PIPELINE
#   git show HEAD~1:.github/workflows/release.yml   # or the upstream remote
#   git checkout upstream/main -- .github/workflows/release.yml
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release under this tag (e.g. v3.20.3-win.1). Leave empty to only build artifacts."
        required: false
        default: ""
      build_installers:
        description: "Also build MSI/NSIS installers. Portable-only is faster; published releases always include installers."
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64 (unsigned)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Record Rust compiler fingerprint
        id: rust-compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Run in the repository so rust-toolchain.toml selects the compiler
          # actually used by Cargo, rather than assuming setup's moving stable.
          $version = (& rustc -vV | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Unable to identify the build compiler' }
          Write-Host $version
          $hasher = [Security.Cryptography.SHA256]::Create()
          try {
            $fingerprint = [BitConverter]::ToString(
              $hasher.ComputeHash([Text.Encoding]::UTF8.GetBytes($version))
            ).Replace('-', '').ToLowerInvariant()
          } finally {
            $hasher.Dispose()
          }
          "fingerprint=$fingerprint" >> $env:GITHUB_OUTPUT

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      # GitHub caches are immutable. A lockfile-only exact hit never saved the
      # newly compiled workspace (observed on run 42343668016). Save a snapshot
      # per compiler/lock/commit and restore the newest compatible release one.
      # Keep the same paths for the legacy release-cache migration: changing
      # paths changes the cache version and would force a cold dependency build.
      - name: Cache Cargo registry and build
        id: cargo-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-v2-${{ steps.rust-compiler.outputs.fingerprint }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-v2-${{ steps.rust-compiler.outputs.fingerprint }}-${{ hashFiles('src-tauri/Cargo.lock') }}-
            ${{ runner.os }}-cargo-release-v2-${{ steps.rust-compiler.outputs.fingerprint }}-
            ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Resolve the version string used for artifact names and, when a tag was
      # supplied, the release tag. Tag pushes use the tag itself; a plain manual
      # run falls back to the package.json version plus the short SHA so
      # successive builds stay distinguishable.
      - name: Resolve version and release tag
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_BUILD_INSTALLERS: ${{ inputs.build_installers }}
          BUILD_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tag=""
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="${INPUT_TAG}"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          fi
          pkg_version=$(node -p "require('./package.json').version")
          if [ -n "$tag" ]; then
            version="${tag#v}"
          else
            version="${pkg_version}-${GITHUB_SHA:0:7}"
          fi
          installers="false"
          if [ -n "$tag" ] || [ "$BUILD_EVENT" != "workflow_dispatch" ] || [ "${INPUT_BUILD_INSTALLERS:-false}" = "true" ]; then
            installers="true"
          fi
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "build_installers=${installers}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: '${tag}'"
          echo "Resolved version: '${version}'"
          echo "Build installers: ${installers}"

      - name: Build Tauri App (Windows x64, unsigned)
        shell: pwsh
        env:
          BUILD_INSTALLERS: ${{ steps.meta.outputs.build_installers }}
        run: |
          $ErrorActionPreference = 'Stop'
          # --bundles must stay quoted: PowerShell would otherwise expand
          # "msi,nsis" into two separate arguments.
          #
          # --config merges tauri.unsigned.conf.json into tauri.conf.json
          # (later values win, arrays are replaced) and carries two overrides:
          #   bundle.createUpdaterArtifacts=false -> no minisign key needed
          #   plugins.updater.endpoints=[]        -> self-built binary can never
          #                                          install the official release
          #                                          over these fork patches
          # Tauri 2.8 already restricts desktop Cargo builds to --bins.
          # --no-bundle keeps the same release compiler/profile/frontend hook
          # while skipping WiX/NSIS downloads and installer packaging.
          if ($env:BUILD_INSTALLERS -eq 'true') {
            pnpm tauri build --bundles "msi,nsis" --config src-tauri/tauri.unsigned.conf.json
          } else {
            pnpm tauri build --no-bundle --config src-tauri/tauri.unsigned.conf.json
          }
          if ($LASTEXITCODE -ne 0) { throw 'Tauri build failed' }

      - name: Prepare Windows assets
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.meta.outputs.version }}
          BUILD_INSTALLERS: ${{ steps.meta.outputs.build_installers }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:BUILD_VERSION
          $targetRoot = 'src-tauri/target/release'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          # Installer collection follows the same mode as the compile step;
          # portable-only must neither require nor upload stale cached bundles.
          if ($env:BUILD_INSTALLERS -eq 'true') {
          # 1) MSI installer.
          $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/msi') -Recurse -Include *.msi -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $msi) { throw 'MSI installer not found under src-tauri/target/release/bundle/msi' }
          $msiName = "CC-Switch-$version-Windows-x64.msi"
          Copy-Item $msi.FullName (Join-Path 'release-assets' $msiName)
          Write-Host "MSI: $msiName"

          # 2) NSIS setup executable (optional; a friendlier double-click installer).
          $nsis = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/nsis') -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike '*cc-switch.exe' } |
            Select-Object -First 1
          if ($null -ne $nsis) {
            $nsisName = "CC-Switch-$version-Windows-x64-setup.exe"
            Copy-Item $nsis.FullName (Join-Path 'release-assets' $nsisName)
            Write-Host "NSIS setup: $nsisName"
          } else {
            Write-Warning 'NSIS setup not produced (optional, not fatal)'
          }
          }

          # 3) Portable package: the raw executable plus the same marker file the
          #    upstream workflow ships to identify the portable variant.
          $exe = Join-Path $targetRoot 'cc-switch.exe'
          if (-not (Test-Path $exe)) { throw "Portable executable not found: $exe" }
          $portableDir = 'release-assets/CC-Switch-Portable'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item $exe $portableDir
          @(
            '# CC Switch portable build marker',
            'portable=true'
          ) | Set-Content -Path (Join-Path $portableDir 'portable.ini') -Encoding UTF8
          $portableZip = "release-assets/CC-Switch-$version-Windows-x64-Portable.zip"
          Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZip -Force
          Remove-Item -Recurse -Force $portableDir
          Write-Host "Portable: $(Split-Path $portableZip -Leaf)"

      - name: List prepared assets
        shell: bash
        run: ls -la release-assets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cc-switch-windows-x64-unsigned-${{ steps.meta.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          # Portable ZIP/MSI/NSIS outputs are already compressed.
          compression-level: 0

      # Only runs when a tag was supplied (tag push, or the release_tag input).
      # A plain manual run stays artifact-only, so experimenting never litters
      # the Releases page.
      - name: Publish GitHub Release
        if: steps.meta.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: CC Switch ${{ steps.meta.outputs.tag }} (Windows x64, unsigned)
          prerelease: true
          files: release-assets/*
          body: |
            ## CC Switch ${{ steps.meta.outputs.tag }} - Windows x64 (unsigned)

            Fork build of `farion1231/cc-switch`, produced without any signing
            key so GitHub Actions can build it without repository secrets.

            ### Download

            - `CC-Switch-${{ steps.meta.outputs.version }}-Windows-x64.msi` - installer (recommended)
            - `CC-Switch-${{ steps.meta.outputs.version }}-Windows-x64-setup.exe` - NSIS setup, if produced
            - `CC-Switch-${{ steps.meta.outputs.version }}-Windows-x64-Portable.zip` - portable, unzip and run

            ### Notes

            - Not code-signed: Windows SmartScreen may warn on first launch.
            - `bundle.createUpdaterArtifacts` is disabled in this build, so no
              `.sig` / `latest.json` is published and the Tauri auto-updater
              cannot be fed from this Release.
            - The in-app updater is switched off on purpose
              (`plugins.updater.endpoints` is empty). This fork carries patches
              upstream does not have, and letting the app update itself would
              install the official build over them. "Check for Updates" will
              therefore report a failure instead of offering an upgrade.
            - Built from commit `${{ github.sha }}`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
